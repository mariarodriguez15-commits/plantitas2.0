<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - CultivaWeb</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-emerald-50 px-4">
  <main x-data="login" class="w-full max-w-md rounded-2xl bg-white p-6 shadow-md">
    <h1 class="text-center text-2xl font-bold text-emerald-800">Iniciar sesión</h1>

    <p x-cloak x-show="errorGeneral" x-text="errorGeneral" role="alert"
       class="mt-4 rounded-lg bg-rose-50 p-3 text-sm text-rose-700"></p>

    <form id="formLogin" method="post" novalidate @submit.prevent="enviar()" class="mt-6 flex flex-col">
      <label for="correo" class="text-sm font-medium text-slate-700">Correo</label>
      <input type="email" id="correo" name="correo" x-model="form.correo" required
             :aria-invalid="errores.correo ? 'true' : 'false'"
             :class="errores.correo ? 'border-rose-500' : 'border-slate-300'"
             class="mt-1 w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <p x-show="errores.correo" x-text="errores.correo" class="mt-1 text-sm text-rose-600"></p>

      <label for="clave" class="mt-4 text-sm font-medium text-slate-700">Contraseña</label>
      <input type="password" id="clave" name="clave" x-model="form.clave" required
             :aria-invalid="errores.clave ? 'true' : 'false'"
             :class="errores.clave ? 'border-rose-500' : 'border-slate-300'"
             class="mt-1 w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <p x-show="errores.clave" x-text="errores.clave" class="mt-1 text-sm text-rose-600"></p>

      <button type="submit" :disabled="enviando"
              class="mt-6 rounded-lg bg-emerald-600 py-2 text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">
        <span x-text="enviando ? 'Ingresando…' : 'Ingresar'">Ingresar</span>
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-slate-600">
      ¿No tienes cuenta? <a href="registro.html" class="text-emerald-700 underline">Regístrate aquí</a>
    </p>
  </main>

  <script type="module" src="js/login.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
