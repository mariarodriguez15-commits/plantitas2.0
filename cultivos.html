<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-white text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-50" x-data="{ menuAbierto: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">

        <h1 class="text-2xl font-bold tracking-wide text-white leading-none">CultivaWeb</h1>

        <nav class="hidden md:flex items-center gap-2">
          <a href="panel.html" class="px-3.5 py-2 text-sm font-medium text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">
            Panel principal
          </a>

          <a href="cultivos.html" aria-current="page" class="px-3.5 py-2 text-sm font-semibold bg-emerald-800 text-white shadow-inner">
            Cultivos
          </a>

          <a href="sensores.html" class="px-3.5 py-2 text-sm font-medium text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">
            Sensores
          </a>

          <a href="index.html" class="px-3.5 py-2 text-sm font-medium text-red-200 hover:bg-red-900/40 hover:text-white transition">
            Cerrar Sesión
          </a>
        </nav>
        <div class="flex md:hidden">
          <button @click="menuAbierto = !menuAbierto" type="button" aria-label="Abrir menú"
                  class="p-2 rounded-xl text-emerald-200 hover:text-white hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-600 ml-auto">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
    </div>
      <nav x-show="menuAbierto"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 -translate-y-2"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 -translate-y-2"
           x-cloak
           class="md:hidden py-3 border-t border-emerald-800 flex flex-col items-end space-y-1">
        <a href="panel.html" class="w-full text-right px-4 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800">
          Inicio
        </a>
        <a href="cultivos.html" aria-current="page" class="w-full text-right px-4 py-2 text-sm font-bold bg-emerald-800 text-white">
          Cultivos
        </a>
        <a href="sensores.html" class="w-full text-right px-4 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800">
          Sensores
        </a>
        <a href="index.html" class="w-full text-right px-4 py-2 text-sm font-semibold text-red-300 hover:bg-red-900/50">
          Cerrar Sesión
        </a>
      </nav>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <section class="bg-white p-6 border border-slate-500 shadow-xs">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-slate-900">Gestión de Cultivos</h2>
          <p class="text-sm text-slate-500 mt-0.5">Busca por nombre o filtra por estado y tipo de cultivo.</p>
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center gap-3">
          <div class="relative">
            <label for="busquedaCultivo" class="sr-only">Buscar por nombre</label>
            <input type="text" id="busquedaCultivo" x-model.trim="busqueda" placeholder="Buscar cultivo..."
                   class="w-full sm:w-56 border border-slate-400 bg-white px-3.5 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
          </div>

          <div>
            <label for="filtroEstado" class="sr-only">Filtrar por estado</label>
            <select id="filtroEstado" x-model="filtroEstado"
                    class="w-full sm:w-auto border border-slate-400 bg-white px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
              <option value="Todos">Todos los estados</option>
              <option value="Activo">Activo</option>
              <option value="En crecimiento">En crecimiento</option>
              <option value="Cosechado">Cosechado</option>
              <option value="En alerta">En alerta</option>
            </select>
          </div>

          <div>
            <label for="filtroTipo" class="sr-only">Filtrar por tipo</label>
            <select id="filtroTipo" x-model="filtroTipo"
                    class="w-full sm:w-auto border border-slate-400 bg-white px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
              <option value="Todos">Todos los tipos</option>
              <template x-for="tipo in tiposDisponibles" :key="tipo">
                <option :value="tipo" x-text="tipo"></option>
              </template>
            </select>
          </div>

          <button type="button" 
                  x-show="busqueda !== '' || filtroEstado !== 'Todos' || filtroTipo !== 'Todos'"
                  @click="limpiarFiltros()"
                  x-cloak
                  class="px-3.5 py-2 text-xs font-semibold text-slate-600 hover:text-slate-900 border border-slate-300 hover:bg-slate-100 transition cursor-pointer">
            Limpiar
          </button>
        </div>
      </div>
    </section>

    
</main>
    <div x-data="{nombreCultivo:'', tipoCultivo:'', cultivo: [],
    init(){
        const guardados = localStorage.getItem('misCultivos');
        if(guardados){
            this.cultivo = JSON.parse(guardados);
        }
    },
    
    agregarCultivo(){
        if(this.nombreCultivo.trim() !== '' && this.tipoCultivo.trim() !== ''){
            this.cultivo.push({
                nombre: this.nombreCultivo,
                tipo: this.tipoCultivo
            });

            localStorage.setItem('misCultivos',JSON.stringify(this.cultivo));
            this.nombreCultivo = '';
            this.tipoCultivo = '';
        }

    }
    }" x-init="init()">

        <section class="bg-white p-6 border border-slate-700 mx-96 m-4 ">
        <h2 class="bg-emerald-900 text-slate-200 text-center m-2 text-2xl rounded-sm g-2">Agregar Nuevo Cultivo</h2>

            <form @submit.prevent="agregarCultivo()" class="space-y-4">
                
                <div>
                    <label for="nombreCultivo" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">
                        Nombre
                    </label>
                    <input
                    type="text"
                    x-model="nombreCultivo" 
                    name="nombreCultivo" required
                    placeholder="Ej:Cultivo A"
                    class="w-full border border-slate-400 px-3.5 py-2 text-sm text-slate-800 placeholder-slate-400">
                </div>
            
                <div>
                    <label for="tipoCultivo" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">
                        Tipo
                    </label>
                    <input 
                    type="text" 
                    x-model="tipoCultivo" 
                    name="tipoCultivo" required
                    placeholder="Ej:Maíz"
                    class="w-full border border-slate-400 px-3.5 py-2 text-sm text-slate-800 placeholder-slate-400">
                </div>

                <button type="submit" class="w-full mt-2 bg-emerald-800 hover:bg-emerald-700 active:scale-[0.99] text-white font-medium py-2.5 px-4 text-sm transition duration-150 shadow-sm cursor-pointer disabled:opacity-50">
                    Agregar
                </button>



            </form>
        </section>
        
        <section class="bg-slate-100 p-6 border border-slate-500 mx-auto max-w-2xl shadow-md flex flex-col m-4 ">
        <h2 class="bg-emerald-900 text-slate-200 text-2xl text-center rounded-sm p-4 shadow-md font-semibold">
            Listado de Cultivos
        </h2>
        <div class="overflow-x-auto">
            <table class="bg-slate-200 text-base text-center w-full rounded-lg">
                <thead class="bg-slate-200 text-slate-700 text-lg uppercase ">
                    <tr>
                        <th class="p-3">Cultivo</th>
                        <th class="p-3">Tipo</th>
                        <th class="p-3">Estado</th>
                    </tr>
                </thead>
                <tbody class ="divide-y divide-slate-200">
                    <template x-for="(c,index) in cultivo" :key ="index">
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 font-medium text-slate-700" x-text="c.nombre">Cultivo 1</td>
                            <td class="p-3 font-medium text-slate-700" x-text="c.tipo">Maíz</td>
                            <td class="p-3">Estado</td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <p x-show="cultivo.length ==0" class="text-center text-sm text-slate-400 py-4"></p>
        </div>
        
        </section>

    </div>
    
  <script type="module">
    import { protegerRuta, configurarCerrarSesion } from './js/guardia.js';
    
    protegerRuta(); // 
    configurarCerrarSesion(); 
  </script>

</body>
</html>
