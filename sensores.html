<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Principal</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!--<link rel="stylesheet" href="css/style.css">-->
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-rounded antialiased">
  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">

        <h1 class="text-2xl font-bold tracking-wide text-white leading-none">CultivaWeb</h1>
        
        <nav class="hidden md:flex items-center gap-2">
          <a href="panel.html" class="px-3.5 py-2  text-sm font-semibold bg-emerald-800 text-white shadow-inner">
              Panel principal
            </a>

          <a href="cultivos.html" class="px-3.5 py-2 text-sm font-medium text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">
              Cultivos
            </a>

          <a href="sensores.html" aria-current="page" class="px-3.5 py-2 text-sm font-semibold bg-emerald-800 text-white shadow-inner">
              Sensores
            </a>

          <a href="index.html" class="px-3.5 py-2 text-sm font-medium text-red-200 hover:bg-red-900/40 hover:text-white transition">
              Cerrar Sesión
            </a>
      </nav>
    </div>
  </header>

  <div class="Contenedores">
    <div class="filtros">
      <label>Cultivo</label>
      <select id="Cultivo">
        <option value="Cultivo1">Cultivo de Maiz</option>
        <option value="Cultivo2">Cultivo de Ají</option>
      </select>
    </div>

    <div class="section-box">
      <h2>Agregar sensor al cultivo seleccionado</h2>
      <form id="formAgregarSensor" class="form-red">
        <div class="form-group">
          <label for="nombreSensor">Nombre del Sensor:</label>
          <input type="text" id="nombreSensor" placeholder="Ej: Sensor 1" required>
        </div>

      <div class="form-group">
        <label for="tipoSensor">Tipo de sensor:</label>
        <input type="text" id="tipoSensor" placeholder="Ej: Humedad" required>
      </div>

      <div class="form-group">
        <label for="estadoSensor">Estado:</label>
        <select id="estadoSensor">
          <option value="Activo">Activo</option>
          <option value="Desconectado">Desconectado</option>
          <option value="Alerta">Alerta</option>
          <option value="Mantenimiento">Mantenimiento</option>
        </select>
      </div>
      <button type="submit" class="btn-action">Agregar Sensor</button>
      </form>
    </div>
    
  </div>

  <div class="section-box">
    <div class="section-box-header">
      <h2>Sensores</h2>
      <span id="InfoSensorCount" class="badge-count">0 sensor(es)</span>
    </div>
      
    <div class="table-responsive">
      <table class="tabla-sensor">
        <thead>
          <tr>
            <th>Sensor</th>
            <th>Tipo</th>
            <th>Estado</th>
          </tr>
          </thead>
        <tbody id="cuerpoTablaSensores">
            </tbody>
      </table>
    </div>
  </div>


      
<script src="js/sensores.js" defer></script>
</body>
