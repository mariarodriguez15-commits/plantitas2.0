<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Principal</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-rounded antialiased" x-data="sensoresApp()" x-init="initApp()">
  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">

        <h1 class="text-2xl font-bold tracking-wide text-white leading-none">CultivaWeb</h1>

        <nav class="hidden md:flex items-center gap-2">
          <a href="panel.html" class="px-3.5 py-2  text-sm font-semibold bg-emerald-800 text-white shadow-inner">
              Panel principal
            </a>

          <a href="cultivos.html" class="px-3.5 py-2 text-sm font-medium text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">
              Cultivos
            </a>

          <a href="sensores.html" aria-current="page" class="px-3.5 py-2 text-sm font-semibold bg-emerald-800 text-white shadow-inner">
              Sensores
            </a>

          <a href="index.html" class="px-3.5 py-2 text-sm font-medium text-red-200 hover:bg-red-900/40 hover:text-white transition">
              Cerrar Sesión
            </a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <section class="bg-white  p-6 border border-slate-500">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-slate-900">Seleccione el cultivo</h2>
          <p class="text-sm text-slate-500 mt-0.5">Selecciona el cultivo a supervisar o asociar sensores.</p>
        </div>
        <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3">
          <label for="nuevoCultivoDestino" class="text-sm font-semibold text-slate-700">Cultivo seleccionado:</label>
          <select id="cultivoSeleccionado" x-model.number="cultivoFiltroId"
                  class=" border border-slate-400 bg-white px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
            <template x-for="c in cultivosDisponibles" :key="c.id">
              <option :value="c.id" x-text="c.nombre"></option>
            </template>
          </select>
        </div>
      </div>
    </section>

    <section class="bg-white p-4  border border-slate-500 lg:col-span-1">
      <h3 class="text-xl font-bold text-slate-900 mb-4">Agregar Sensor</h3>
      <form @submit.prevent="agregarSensor" class="space-y-4">

        <div>
          <label for="nombreSensor" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">
            Identificador
          </label>
          <input type="text" id="nombreSensor" x-model.trim="nuevoSensor.nombre" placeholder="Ej: Sensor A" required class="w-full  border border-slate-400 px-3.5 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
        </div>
        <div>
          <label for="tipoSensor" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">
            Tipo de Medición
          </label>
          <input type="text" id="tipoSensor" x-model.trim="nuevoSensor.tipo" placeholder="Ej: Temperatura" required class="w-full  border border-slate-400 px-3.5 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
        </div>

        <div>
          <label for="estadoSensor" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">
            Estado 
          </label>
          <select id="estadoSensor" x-model="nuevoSensor.estado"  class="w-full border border-slate-400 bg-white px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
            <option value="Activo">Activo</option>
            <option value="Desconectado">Desconectado</option>
            <option value="Alerta">Alerta</option>
            <option value="Mantenimiento">Mantenimiento</option>
          </select>
        </div>

        <button type="submit" :disabled="enviando" class="w-full mt-2 bg-emerald-800 hover:bg-emerald-700 active:scale-[0.99] text-white font-medium py-2.5 px-4 text-sm transition duration-150 shadow-sm cursor-pointer disabled:opacity-50">
          <span x-text="enviando ? 'Guardando sensor...' : '+ Registrar Sensor'"></span>
        </button>
      </form>
    </section>

    <section class="bg-white border border-slate-500 overflow-hidden lg:col-span-2">
      <div class="p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-slate-100">
        <div>
          <h3 class="text-2xl font-bold text-slate-900">Sensores del Cultivo</h3>
          <p class="text-xs text-slate-500 mt-0.5">Condiciones actuales</p>
        </div>
        <span id="InfoSensorCount" class="inline-flex items-center self-start sm:self-auto px-3 py-1  text-2xs font-bold text-emerald-800" x-text="sensoresFiltrados.length + ' sensor(es)'">
        </span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-xs uppercase font-bold text-slate-500 border-b border-slate-200">
            <tr>
              <th scope="col" class="px-6 py-3.5">Sensor</th>
              <th scope="col" class="px-6 py-3.5">Tipo</th>
              <th scope="col" class="px-6 py-3.5 text-center">Estado</th>
            </tr>
          </thead>
            
          <tbody class="divide-y divide-slate-100">
            <template x-for="sensor in sensoresFiltrados" :key="sensor.id">
              <tr class="hover:bg-slate-50/80 transition">
                  <td class="px-6 py-3.5 font-medium text-slate-900" x-text="sensor.nombre"></td>
                  <td class="px-6 py-3.5" x-text="sensor.tipo"></td>
                  <td class="px-6 py-3.5 text-center">
                    <span class="inline-flex px-2.5 py-0.5 text-xs font-semibold rounded-xl border"
                          :class="{
                            'bg-emerald-50 text-emerald-700 border-emerald-200': sensor.estado === 'Activo',
                            'bg-red-50 text-red-700 border-red-200': sensor.estado === 'Alerta',
                            'bg-slate-100 text-slate-600 border-slate-200': sensor.estado === 'Desconectado',
                            'bg-blue-50 text-blue-700 border-blue-200': sensor.estado === 'Mantenimiento'
                          }"
                          x-text="sensor.estado">
                    </span>
                  </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('sensoresApp', () => ({
        cultivosDisponibles: [
          { id: 1, nombre: 'Maíz' },
          { id: 2, nombre: 'Ají' }
        ],
        nuevoSensor: {
          nombre: '',
          tipo: '',
          estado: 'Activo'
        },
        errores: {
          nombre: '',
          tipo: ''
        },
        enviando: false,
        initApp() {
          const guardados = localStorage.getItem('cultivaweb_sensores');
          if (guardados) {
            try {
              this.sensores = JSON.parse(guardados);
            } catch (e) {
              console.error('Error parseando sensores locales:', e);
            }
          }
        },

        get sensoresFiltrados() {
          return this.sensores.filter(s => Number(s.cultivoId) === Number(this.cultivoFiltroId));
        },

         validarFormulario() {
          let esValido = true;
          this.errores = { nombre: '', tipo: '' };

          if (!this.nuevoSensor.nombre) {
            this.errores.nombre = 'Se requiere el nombre del sensor.';
            esValido = false;
          }
          if (!this.nuevoSensor.tipo) {
            this.errores.tipo = 'Se requiere el tipo de medición del sensor.';
            esValido = false;
          }

          return esValido;
        },

        
      }));
    });

  </script>

</body>
