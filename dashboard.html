<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Principal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="panel">
  <header class="header">
    <h1>Bienvenido Usuario</h1>
    <div>
      <a href="cultivos.html"><button>Ver Cultivos</button></a>
      <a href="index.html"><button>Cerrar Sesion</button></a>
    </div>
  </header>

  <div class="Contenedores">
    <div class="filtros">
      <label>Cultivo</label>
      <select id="Cultivo">
        <option value="Cultivo1">Cultivo de Maiz</option>
        <option value="Cultivo2">Cultivo de Ají</option>
      </select>
    </div>

    <div id="seccionCultivoNuevo" class="seccion-N">
      <h2>Agregar cultivo nuevo</h2>
      <form id="formCultivoNuevo" class="form-red">
        <div class="form-group">
          <label for="nombreCultivoNuevo">Nombre del cultivo nuevo:</label>
          <input type="text" id="nombreCultivoNuevo" placeholder="Ejemplo: cultivo de palta" required>
        </div>
        <button type="submit" class="btn-action">Guardar cultivo</button>
        <button type="button" id="btnCancelarCultivo" class="btn-action">Cancelar</button>
      </form>
    </div>
    
  </div>

  <div class="section-box">
    <div class="section-box-header">
      <h2>Sensores</h2>
    </div
      
    <div class="table-responsive">
      <table class="tabla-sensor">
        <thead>
          <tr>
            <th>Sensor</th>
            <th>Tipo</th>
            <th>Estado</th>
          </tr>
          </thead>
        <tbody id="cuerpoTablaSensores">
            </tbody>
      </table>
    </div>
  </div>


      
<script src="js/script.js" defer></script>
</body>
