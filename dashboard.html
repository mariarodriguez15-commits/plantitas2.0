<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Principal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="panel">
  <header class="header">
    <h1>Bienvenido Usuario</h1>
    <div>
      <a href="cultivos.html"><button>Ver Cultivos</button></a>
      <a href="index.html"><button>Cerrar Sesion</button></a>
    </div>
  </header>

  <div class="Contenedores">
    <div class="filtros">
      <label>Cultivo</label>
      <select id="Cultivo">
        <option value="Cultivo1">Cultivo de Maiz</option>
        <option value="Cultivo2">Cultivo de Ají</option>
      </select>
    </div>

    <div class="section-box">
      <h2>Agregar sensor al cultivo seleccionado</h2>
      <form id="formAgregarSensor" class="form-red">
        <div class="form-group">
          <label for="nombreSensor">Nombre del Sensor:</label>
          <input type="text" id="nombreSensor" placeholder="Ej: Sensor 1" required>
        </div>

      <div class="form-group">
        <label for="tipoSensor">Tipo de sensor:</label>
        <input type="text" id="tipoSensor" placeholder="Ej: Humedad" required>
      </div>

      <div class="form-group">
        <label for="estadoSensor">Estado:</label>
        <select id="estadoSensor">
          <option value="Activo">Activo</option>
          <option value="Desconectado">Desconectado</option>
          <option value="Alerta">Alerta</option>
          <option value="Mantenimiento">Mantenimiento</option>
        </select>
      </div>
      <button type="submit" class="btn-action">Agregar Sensor</button>
      </form>
    </div>
    
  </div>

  <div class="section-box">
    <div class="section-box-header">
      <h2>Sensores</h2>
    </div
      
    <div class="table-responsive">
      <table class="tabla-sensor">
        <thead>
          <tr>
            <th>Sensor</th>
            <th>Tipo</th>
            <th>Estado</th>
          </tr>
          </thead>
        <tbody id="cuerpoTablaSensores">
            </tbody>
      </table>
    </div>
  </div>


      
<script src="js/dashboard.js" defer></script>
</body>
