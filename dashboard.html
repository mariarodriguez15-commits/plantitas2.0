<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Principal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="panel">
  <header class="header">
    <h1>Bienvenido Usuario</h1>
    <div>
      <a href="cultivos.html"><button>Ver Cultivos</button></a>
      <a href="index.html"><button>Cerrar Sesion</button></a>
    </div>
  </header>

  <div class="Contenedores">
    <div class="filtros">
      <label>Cultivo</label>
      <select id="Cultivo">
        <option value="Cultivo1">Cultivo de Maiz</option>
        <option value="Cultivo2">Cultivo de Ají</option>
      </select>
    </div>
  </div>

  <div class="section-box">
    <h2>Sensores</h2>
    <table class="tabla-sensor">
      <thead>
        <tr>
          <th>Sensor</th>
          <th>Tipo</th>
          <th>Estado</th>
        </tr>
        </thead>
<!-- Ejemplo -->
      <tbody>
        <tr>
          <td>Sensor 1</td>
          <td>Termico</td>
          <td>Activo</td>
        </tr>
        <tr>
          <td>Sensor 2</td>
          <td>Humedad</td>
          <td>Desconectado</td>
        </tr>
        </tbody>
    </table>
  </div>


      
<script src="js/script.js" defer></script>
</body>
