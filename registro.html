<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Crear Cuenta</h1>
        <form id="formRegistro" action="#" method="post">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" required>

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" minlength="8" required>

            <label for="confirmarClave">Confirmar Contraseña</label>
            <input type="password" id="confirmarClave" name="confirmarClave" minlength="8" required>

            <button type="submit">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
    </main>

    <script src="js/script.js" defer></script>
</body>
</html>
